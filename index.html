async function fetchAll(build, page = 1000) { // Supabase returns max 1000 rows/request: page through

    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < page) return out;

  const m = {}, parts = [];
  for (let i = 0; i < p.length; i += 100) parts.push(p.slice(i, i + 100));

async function toPhoto(file, max = 360) { // WebP where the browser can encode it (Safari falls back to JPEG) + a 16px blurred placeholder
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Could not read that image")); i.src = URL.createObjectURL(file); });

  const keys = [..."123456789"].map(d => h("button", { on: { click: () => press(d) } }, d));
  keys.push(h("button", { class: "sym", on: { click: () => { if (!busy) { digits = ""; render(); } } } }, "Clear"), h("button", { on: { click: () => press("0") } }, "0"), h("button", { class: "sym", on: { click: back } }, "⌫"));
  verify.addEventListener("click", async () => {
    busy = true; verify.textContent = "Verifying…"; render(); err.textContent = "";
    const { data: res, error } = await db.rpc("mark_attendance", { p_session_id: s.session_id, p_code: digits });
    busy = false; digits = ""; verify.textContent = "Verify";
    if (error) { err.textContent = error.message; return render(); }
    const [k, left] = String(res).split(":");
    if (k === "ok" || k === "already_marked") {
      secure = false;
      return show(studentNav("mark"), h("div", { class: "who" }, avatar(url, student.full_name, "lg", student.photo_lqip), h("strong", {}, student.full_name)),
        h("p", { class: "okline", style: "margin-top:16px" }, k === "ok" ? "✓ Attendance recorded" : "✓ " + MARK_MSG.already_marked), h("p", { class: "muted", style: "text-align:center" }, s.course_code + " — " + s.course_title),
        h("button", { class: "pill go", on: { click: viewDashboard } }, "View my dashboard"));
    }
    err.textContent = k === "invalid_code" ? "Please enter the valid code. " + (+left > 0 ? left + " attempt(s) left." : "No attempts left.") : (MARK_MSG[k] || "Could not verify: " + res);
    render();
  });
  show(studentNav("mark"), h("h1", {}, "Attendance Verification"),
    h("div", { class: "who" }, avatar(url, student.full_name, "lg", student.photo_lqip), h("strong", { style: "margin-top:8px" }, student.full_name), h("span", { class: "muted" }, student.matric_no + " · " + s.course_code)),
    h("p", { class: "muted", style: "text-align:center;margin:12px 6px 0" }, "Administrator: confirm this is the right student, then enter the 6-digit attendance code."),
    h("div", { class: "boxes" }, boxes), err, verify,
    h("button", { class: "link", on: { click: () => { digits = ""; render(); } } }, "Clear code"), h("div", { class: "pad" }, keys));
  secure = true; render();
}

// ================= ADMIN: administrators (primary admin is permanent; only the primary manages others) =================
function adminsCard(admins) {
  const note = h("p", { class: "msg" });

  const cEmail = h("input", { type: "email", placeholder: "Email" }), cName = h("input", { placeholder: "Full name" }), cPw = h("input", { type: "password", autocomplete: "new-password", placeholder: "Temporary password (8+ characters)" });

  const cBtn = h("button", {}, "Create administrator account");
  cBtn.addEventListener("click", async () => {
    if (!/^\S+@\S+\.\S+$/.test(cEmail.value.trim()) || cPw.value.length < 8) return msg(note, "Enter a valid email and a password of at least 8 characters.");
    cBtn.disabled = true; cBtn.textContent = "Creating…"; note.textContent = "";
    const { error } = await db.functions.invoke("admin-users", { body: { action: "create", email: cEmail.value.trim(), password: cPw.value, full_name: cName.value.trim(), role: cRole.value } });
    cBtn.disabled = false; cBtn.textContent = "Create administrator account";

  });
  const eEmail = h("input", { type: "email", placeholder: "Existing account email" });
  const eRole = h("select", {}, h("option", { value: "admin" }, "Admin"), h("option", { value: "super_admin" }, "Super Admin"));
  return h("div", { class: "card" }, h("h2", {}, "Administrators (" + admins.length + ")"),
    admins.map(a => { const mine = a.id === user.id, locked = a.is_primary || mine;
      return h("div", { class: "item" },
        h("div", {}, h("strong", {}, a.full_name || a.email), h("span", { class: "badge" }, a.role === "super_admin" ? "SUPER ADMIN" : "ADMIN"), a.is_primary ? h("span", { class: "badge" }, "PRIMARY") : "", !a.is_active ? h("span", { class: "badge off" }, "INACTIVE") : "", h("div", { class: "muted" }, a.email)),
        locked ? "" : h("div", { class: "row", style: "margin-top:6px;gap:8px" },
          h("button", { class: "ghost sm", on: { click: () => confirm("Change role for " + a.email + "?") && run("Saving", () => db.rpc("set_administrator_role", { p_admin_id: a.id, p_role: a.role === "super_admin" ? "admin" : "super_admin" })) } }, a.role === "super_admin" ? "Make Admin" : "Make Super Admin"),
          h("button", { class: "sm " + (a.is_active ? "bad" : ""), on: { click: () => (!a.is_active || confirm("Remove admin access for " + a.email + "?")) && run("Saving", () => db.rpc("set_administrator_active", { p_admin_id: a.id, p_active: !a.is_active })) } }, a.is_active ? "Deactivate" : "Reactivate"))); }),
    h("label", {}, "Create administrator account"), cEmail, h("div", { style: "height:8px" }), cName, h("div", { style: "height:8px" }), cPw, h("div", { style: "height:8px" }), cRole, cBtn,
    h("label", {}, "Or promote an existing account"), eEmail, h("div", { style: "height:8px" }), eRole,
    h("button", { class: "ghost", on: { click: () => eEmail.value.trim() ? run("Adding", () => db.rpc("add_administrator", { p_email: eEmail.value.trim(), p_full_name: null, p_role: eRole.value })) : msg(note, "Enter an email.") } }, "Add existing account"),
    h("p", { class: "muted", style: "margin-top:10px" }, "The primary Super Admin can never be changed. You cannot change your own role."), note);
}

// ================= ADMIN: students =================
async function viewStudents() {
  if (adminRole !== "super_admin") return denied();
  show(adminNav("students"), loading());
  const { data: depts } = await db.from("departments").select(DEPT_SEL).order("name");
  const dn = Object.fromEntries((depts || []).map(d => [d.id, d.name]));
  const PAGE = 25; let page = 0, timer = 0, total = 0;
  const title = h("h1", {}, "Students"), q = h("input", { placeholder: "Search name or registration number" }), list = h("div"), pager = h("div", { class: "row" });
  async function load() {
    list.replaceChildren(loading());
    const t = q.value.trim().replace(/[%,()*\\]/g, "");
    let qb = db.from("students").select("*", { count: "exact" }).order("full_name").order("id").range(page * PAGE, page * PAGE + PAGE - 1);
    if (t) qb = qb.or("full_name.ilike.%" + t + "%,matric_no.ilike.%" + t + "%");
    const { data, count, error } = await qb;
    if (error) return list.replaceChildren(h("p", { class: "err" }, error.message));
    total = count || 0; title.textContent = "Students (" + total + ")";
    const pm = await photoUrls((data || []).map(r => r.photo_path));
    list.replaceChildren(...(data?.length ? data.map(r => h("div", { class: "item who2 click", on: { click: () => viewStudentEdit(r, pm[r.photo_path], depts) } }, avatar(pm[r.photo_path], r.full_name, "", r.photo_lqip),
      h("div", { class: "grow" }, h("strong", {}, r.full_name), h("div", { class: "muted" }, r.matric_no + " · " + (dn[r.department_id] || "—") + (r.level ? " · L" + r.level : ""))))) : [h("p", { class: "muted" }, "No students found.")]));
    const pages = Math.max(1, Math.ceil(total / PAGE));
    pager.replaceChildren(h("button", { class: "ghost sm", disabled: page === 0, on: { click: () => { page--; load(); } } }, "← Prev"), h("span", { class: "muted" }, "Page " + (page + 1) + " of " + pages),
      h("button", { class: "ghost sm", disabled: page + 1 >= pages, on: { click: () => { page++; load(); } } }, "Next →"));
  }
  q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); });
  show(adminNav("students"), title, h("div", { class: "card" }, q, list, pager), signOutBtn());
  load();
}
function viewStudentEdit(r, url, depts) {
  const name = h("input", { value: r.full_name }), matric = h("input", { value: r.matric_no }), level = levelSelect(r.level || "", false);
  const dept = h("select", {}, deptOptions(depts, r.department_id));
  const note = h("p", { class: "msg" });
  show(adminNav("students"), h("button", { class: "ghost sm", on: { click: viewStudents } }, "← Students"),
    h("div", { class: "who" }, avatar(url, r.full_name, "lg", r.photo_lqip)),
    h("div", { class: "card" }, h("label", {}, "Full name"), name, h("label", {}, "Registration number"), matric, h("label", {}, "Department"), dept, h("label", {}, "Level"), level,
      h("p", { class: "muted", style: "margin-top:10px" }, "Terms accepted: " + when(r.terms_accepted_at) + (r.terms_version ? " (v" + r.terms_version + ")" : "") + ". Registered courses are locked and cannot be edited here."),
      h("button", { on: { click: async () => {
        if (!name.value.trim() || !matric.value.trim()) return msg(note, "Name and registration number are required.");
        const { error } = await db.from("students").update({ full_name: name.value.trim(), matric_no: matric.value.trim(), department_id: dept.value, level: level.value || null }).eq("id", r.id);
        error ? msg(note, error.message.includes("duplicate") ? "That registration number is already used." : error.message) : (msg(note, "Saved.", true), setTimeout(viewStudents, 700));
      } } }, "Save changes"), note));
}

// ================= ADMIN: reports & export =================
const csvCell = v => { let t = String(v ?? ""); if (/^[=+@]/.test(t) || (/^-/.test(t) && isNaN(t))) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
const sheetId = u => (String(u).match(/\/d\/([A-Za-z0-9_-]+)/) || String(u).match(/^([A-Za-z0-9_-]{20,})$/) || [])[1] || "";

async function viewReports() {
  if (adminRole !== "super_admin") return denied();
  show(adminNav("reports"), loading());
  const [{ data: depts, error: e1 }, { data: courses, error: e2 }] = await Promise.all([db.from("departments").select(DEPT_SEL).order("name"), db.from("courses").select("id,code,title,department_id").order("code")]);
  if (e1 || e2) return show(adminNav("reports"), errBox(e1 || e2));
  const dept = h("select", {}, h("option", { value: "" }, "All departments"), deptOptions(depts));
  const course = h("select"), from = h("input", { type: "date" }), to = h("input", { type: "date" });
  const fillC = () => course.replaceChildren(h("option", { value: "" }, "All courses"), ...opts(courses.filter(c => !dept.value || c.department_id === dept.value), c => c.code + " — " + c.title));
  dept.addEventListener("change", fillC); fillC();
  let saved = ""; try { saved = localStorage.getItem("sheetUrl") || ""; } catch {}
  const sheet = h("input", { placeholder: "https://docs.google.com/spreadsheets/d/…", value: saved });
  const out = h("div"), note = h("p", { class: "msg" });
  let rows = [];
  const filters = () => ({ p_department_id: dept.value || null, p_course_id: course.value || null, p_from: from.value || null, p_to: to.value || null });

  const preview = h("button", {}, "Preview report");
  preview.addEventListener("click", async () => {
    preview.disabled = true; out.replaceChildren(loading()); note.textContent = "";
    let data, error; try { data = await fetchSummary(filters(), courses, (i, n) => out.replaceChildren(loading("Loading course " + i + " of " + n + "…"))); } catch (e) { error = e; }
    preview.disabled = false;
    if (error) return out.replaceChildren(h("p", { class: "err" }, error.message));
    rows = data; if (!rows.length) return out.replaceChildren(h("p", { class: "muted" }, "No students or sessions match these filters."));
    const csvBtn = h("button", { class: "ghost", on: { click: () => {
      const head = ["Registration No", "Name", "Department", "Course Code", "Course Title", "Sessions Held", "Sessions Attended", "Attendance %"];
      const body = rows.map(r => [r.matric_no, r.full_name, r.department, r.course_code, r.course_title, r.sessions_held, r.sessions_attended, r.attendance_percentage].map(csvCell).join(","));
      const a = h("a", { href: URL.createObjectURL(new Blob(["\ufeff" + [head.map(csvCell).join(","), ...body].join("\r\n")], { type: "text/csv" })), download: "attendance-" + new Date().toISOString().slice(0, 10) + ".csv" });
      document.body.append(a); a.click(); a.remove();
    } } }, "Download CSV");
    const gBtn = h("button", { on: { click: async () => {
      const id = sheetId(sheet.value);
      if (sheet.value && !id) return msg(note, "That doesn't look like a Google Sheets link.");
      try { localStorage.setItem("sheetUrl", sheet.value); } catch {}
      gBtn.disabled = true; gBtn.textContent = "Exporting…"; note.textContent = "";
      const { data: res, error: err } = await db.functions.invoke("export-to-sheets", { body: { ...Object.fromEntries(Object.entries(filters()).map(([k, v]) => [k.slice(2), v])), spreadsheet_id: id } });
      gBtn.disabled = false; gBtn.textContent = "Export to Google Sheets";
      if (err) { let m = err.message; try { m = (await err.context.json()).error || m; } catch {} return msg(note, m); }
      note.className = "msg ok"; note.replaceChildren("Exported " + res.rows + " rows. ", h("a", { href: res.url, target: "_blank", rel: "noopener" }, "Open sheet"));
    } } }, "Export to Google Sheets");
    out.replaceChildren(h("p", { class: "muted" }, rows.length + " rows" + (rows.length > 200 ? " (preview shows the first 200; downloads and exports include all)" : "") + " · percentages count closed or expired sessions only"),
      h("div", { class: "scroll" }, h("table", {}, h("tr", {}, ["Reg. No", "Name", "Course", "Held", "Attended", "%"].map(t => h("th", {}, t))),
        rows.slice(0, 200).map(r => h("tr", {}, [r.matric_no, r.full_name, r.course_code, r.sessions_held, r.sessions_attended, r.attendance_percentage + "%"].map(t => h("td", {}, t)))))),
      csvBtn, h("label", {}, "Google Sheet link (shared with the service account — see README)"), sheet, gBtn);
  });
  show(adminNav("reports"), h("h1", {}, "Reports"),
    h("div", { class: "card" }, h("h2", {}, "Filters"), h("label", {}, "Department"), dept, h("label", {}, "Course"), course,
      h("div", { class: "two" }, h("div", {}, h("label", {}, "From"), from), h("div", {}, h("label", {}, "To"), to)), preview),
    h("div", { class: "card" }, out, note), signOutBtn());
}

db.auth.onAuthStateChange((ev) => {
  if (ev === "PASSWORD_RECOVERY") { recovering = true; viewNewPassword(); }
  else if (ev === "SIGNED_IN" && !user && !recovering) route();
});
route();
const offlineBar = h("div", { class: "offline", role: "status" }, "You're offline. Attendance can't be verified until you reconnect.");
document.body.prepend(offlineBar);
const syncOnline = () => { offlineBar.style.display = navigator.onLine ? "none" : "block"; };
addEventListener("online", syncOnline); addEventListener("offline", syncOnline); syncOnline();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
